name: Build roothide injection probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install RootHide build tools
        run: |
          set -euo pipefail
          brew install ldid dpkg
          git clone --recursive https://github.com/roothide/theos.git "$HOME/roothide-theos"
          export THEOS="$HOME/roothide-theos"
          export GITHUB_TOKEN="${{ github.token }}"
          "$THEOS/bin/install-sdk" latest
      - name: Build minimal probe
        run: |
          set -o pipefail
          export THEOS="$HOME/roothide-theos"
          make -C InjectionProbe clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 DEBUG=0 STRIP=1 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nnp-injection-probe-package
          path: InjectionProbe/build-packages/*.deb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nnp-injection-probe-diagnostics
          path: build.log
          if-no-files-found: ignore
