name: Build Phase 4B display-mode trace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install RootHide build tools
        run: |
          set -euo pipefail
          brew install ldid dpkg
          git clone --recursive https://github.com/roothide/theos.git "$HOME/roothide-theos"
          export THEOS="$HOME/roothide-theos"
          export GITHUB_TOKEN="${{ github.token }}"
          "$THEOS/bin/install-sdk" latest
          git -C "$THEOS" rev-parse HEAD | tee theos-commit.txt
      - name: Build Phase 4B display-mode trace
        run: |
          set -o pipefail
          export THEOS="$HOME/roothide-theos"
          make clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 DEBUG=0 STRIP=1 \
            NNP_SAFE_BOOT_TEST=0 \
            NNP_ENABLE_PHASE4A_READONLY_BACKLIGHT_LOG=0 \
            NNP_ENABLE_PHASE4B_TARGET_TRACE=0 \
            NNP_ENABLE_PHASE4B_ENVIRONMENT_TRACE=0 \
            NNP_ENABLE_PHASE4B_DISPLAY_MODE_TRACE=1 \
            NNP_ENABLE_DISPLAY_ASSERTION_EXPERIMENT=0 \
            NNP_PHASE2E_ARM_AT_START=0 \
            NNP_PHASE2G_OBSERVER=0 \
            NNP_PHASE2G_ARM_AT_START=0 \
            NNP_PHASE2D2_DIAGNOSTIC=0 \
            NNP_PHASE2J_READONLY_RUNTIME=0 \
            NNP_PHASE2J_CALL_GETTERS=0 2>&1 | tee build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notchnowplaying-phase4b-display-mode-diagnostics
          path: |
            build.log
            theos-commit.txt
          if-no-files-found: ignore
      - name: Upload Phase 4B package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: notchnowplaying-phase4b-display-mode-package
          path: build-packages/*.deb
          if-no-files-found: error
