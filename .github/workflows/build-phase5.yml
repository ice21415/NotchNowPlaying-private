name: Build Phase 5 package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.m'
      - '*.h'
      - '*.xm'
      - 'Makefile'
      - 'control'
      - 'NotchNowPlaying.plist'
      - 'research/phase5-locked-visible-experiments.md'
      - '.github/workflows/build-phase5.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install RootHide build tools
        run: |
          set -euo pipefail
          brew install ldid dpkg
          git clone --recursive https://github.com/roothide/theos.git "$HOME/roothide-theos"
          export THEOS="$HOME/roothide-theos"
          export GITHUB_TOKEN="${{ github.token }}"
          "$THEOS/bin/install-sdk" latest
          git -C "$THEOS" rev-parse HEAD | tee theos-commit.txt

      - name: Build Phase 5 normal package
        run: |
          set -o pipefail
          export THEOS="$HOME/roothide-theos"
          make clean package \
            THEOS_PACKAGE_SCHEME=roothide \
            FINALPACKAGE=1 DEBUG=0 STRIP=1 \
            NNP_SAFE_BOOT_TEST=0 \
            NNP_ENABLE_EXPERIMENTAL_LOCKED_VISIBLE=0 \
            NNP_ENABLE_DISPLAY_ASSERTION_EXPERIMENT=0 \
            NNP_PHASE2G_OBSERVER=0 \
            NNP_PHASE2J_READONLY_RUNTIME=0 \
            2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notchnowplaying-phase5-build-diagnostics
          path: |
            build.log
            theos-commit.txt
          if-no-files-found: ignore

      - name: Upload RootHide package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: notchnowplaying-phase5-roothide-package
          path: build-packages/*.deb
          if-no-files-found: error
