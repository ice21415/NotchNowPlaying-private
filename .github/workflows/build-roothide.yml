name: Build and publish RootHide package

on:
  push:
    branches: [main]
    paths:
      - '*.m'
      - '*.h'
      - '*.xm'
      - 'Makefile'
      - 'control'
      - 'NotchNowPlaying.plist'
      - '.github/workflows/build-roothide.yml'

permissions:
  contents: read

env:
  PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
  PUBLIC_REPO: ice21415/NotchNowPlaying

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Install RootHide build tools
        run: |
          set -o pipefail
          brew install ldid dpkg
          git clone --recursive https://github.com/roothide/theos.git "$HOME/roothide-theos"
          export THEOS="$HOME/roothide-theos"
          "$THEOS/bin/install-sdk" latest
          {
            echo "Theos commit: $(git -C "$THEOS" rev-parse HEAD)"
            echo "SDKs:"
            find "$THEOS/sdks" -maxdepth 1 -type d -print | sort
            echo "clang:"
            clang --version | head -n 1
          } | tee toolchain.txt

      - name: Build safe-boot arm64e package
        run: |
          set -o pipefail
          export THEOS="$HOME/roothide-theos"
          mkdir -p build-packages
          make clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 DEBUG=0 STRIP=1 NNP_SAFE_BOOT_TEST=1 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notchnowplaying-build-diagnostics
          path: |
            build.log
            toolchain.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: notchnowplaying-roothide-package
          path: build-packages/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Checkout public package repo
        if: success() && env.PUBLIC_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ env.PUBLIC_REPO_TOKEN }}
          path: public-repo

      - name: Publish to public package repo
        if: success() && env.PUBLIC_REPO_TOKEN != ''
        run: |
          set -euo pipefail
          cp build-packages/*.deb public-repo/
          cd public-repo
          dpkg-scanpackages --multiversion . /dev/null > Packages
          bzip2 -kf Packages
          packages_size=$(wc -c < Packages | tr -d ' ')
          packages_bz2_size=$(wc -c < Packages.bz2 | tr -d ' ')
          md5_packages=$(md5 -q Packages)
          md5_packages_bz2=$(md5 -q Packages.bz2)
          sha256_packages=$(shasum -a 256 Packages | awk '{print $1}')
          sha256_packages_bz2=$(shasum -a 256 Packages.bz2 | awk '{print $1}')
          cat > Release <<EOF
Origin: NotchNowPlaying
Label: NotchNowPlaying
Suite: stable
Codename: stable
Version: 1.0
Architectures: iphoneos-arm64 iphoneos-arm64e
Components: main
Description: NotchNowPlaying RootHide tweak repository
MD5Sum:
 $md5_packages $packages_size Packages
 $md5_packages_bz2 $packages_bz2_size Packages.bz2
SHA256:
 $sha256_packages $packages_size Packages
 $sha256_packages_bz2 $packages_bz2_size Packages.bz2
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.deb Packages Packages.bz2 Release
          git diff --cached --quiet || git commit -m "Publish NotchNowPlaying package"
          git push origin HEAD:main

      - name: Publishing setup notice
        if: success() && env.PUBLIC_REPO_TOKEN == ''
        run: echo "Build succeeded. Set PUBLIC_REPO_TOKEN to enable publishing."
