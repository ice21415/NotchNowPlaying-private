name: Build process sampler tool

on:
  workflow_dispatch:
  push:
    branches: [codex/charging-flow-20261002]
    paths:
      - 'research/tools/nnp_proctop.c'
      - 'research/tools/nnp_batt.c'
      - 'research/tools/nnp_ioreg.c'
      - '.github/workflows/build-proctop.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build and sign research tools
        run: |
          set -euo pipefail
          brew install ldid
          mkdir -p out
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -O2 -Wall -Wextra -Werror \
            research/tools/nnp_proctop.c -o out/nnp_proctop
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -O2 -Wall -Wextra -Werror \
            -framework CoreFoundation -framework IOKit research/tools/nnp_batt.c -o out/nnp_batt
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -O2 -Wall -Wextra -Werror \
            -framework CoreFoundation -framework IOKit research/tools/nnp_ioreg.c -o out/nnp_ioreg
          cat > ent.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key><true/>
              <key>com.apple.private.security.no-container</key><true/>
              <key>com.apple.private.security.no-sandbox</key><true/>
              <key>com.apple.system-task-ports</key><true/>
              <key>task_for_pid-allow</key><true/>
              <key>com.apple.private.proc_pid_rusage</key><true/>
              <key>com.apple.private.kernel.override-cpumon</key><true/>
          </dict>
          </plist>
          EOF
          ldid -Sent.plist out/nnp_proctop
          ldid -Sent.plist out/nnp_batt
          ldid -Sent.plist out/nnp_ioreg
          file out/nnp_proctop out/nnp_batt out/nnp_ioreg

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: nnp-proctop
          path: out/*
          if-no-files-found: error
