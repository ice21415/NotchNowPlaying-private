name: Build phase27 event provenance probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install RootHide build tools
        run: |
          set -euo pipefail
          brew install ldid dpkg
          git clone --recursive https://github.com/roothide/theos.git "$HOME/roothide-theos"
          export THEOS="$HOME/roothide-theos"
          export GITHUB_TOKEN="${{ github.token }}"
          "$THEOS/bin/install-sdk" latest
          git -C "$THEOS" rev-parse HEAD | tee theos-commit.txt
          find "$THEOS/sdks" -maxdepth 1 -type d -name '*.sdk' -print | sort | tee theos-sdks.txt

      - name: Record Apple compiler and SDK versions
        run: |
          set -euo pipefail
          xcodebuild -version | tee xcode-version.txt
          xcrun --find clang | tee clang-path.txt
          xcrun clang --version | tee clang-version.txt
          xcrun --sdk iphoneos --show-sdk-version | tee iphoneos-sdk-version.txt

      - name: Build passive arm64e probe
        run: |
          set -euo pipefail
          export THEOS="$HOME/roothide-theos"
          make -C BacklightFlowProbe clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 DEBUG=0 STRIP=1 THEOS_PACKAGE_DIR=../build-packages 2>&1 | tee build.log

      - name: Verify arm64e package
        run: |
          set -euo pipefail
          package=$(find build-packages -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb -f "$package" Architecture)" = iphoneos-arm64e
          dpkg-deb -x "$package" /tmp/nnp-backlight-flow-probe
          dylib=$(find /tmp/nnp-backlight-flow-probe -name NNPBacklightFlowProbe.dylib -print -quit)
          test -n "$dylib"
          file "$dylib"
          xcrun lipo "$dylib" -verify_arch arm64e
          xcrun vtool -show-build "$dylib"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nnp-phase27-build-diagnostics
          path: |
            build.log
            theos-commit.txt
            theos-sdks.txt
            xcode-version.txt
            clang-path.txt
            clang-version.txt
            iphoneos-sdk-version.txt
          if-no-files-found: ignore

      - name: Upload package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nnp-phase27-backlight-probe-arm64e
          path: build-packages/*.deb
          if-no-files-found: error
