name: Build load path dry run diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install RootHide build tools
        run: |
          set -euo pipefail
          brew install ldid dpkg
          git clone --recursive https://github.com/roothide/theos.git "$HOME/roothide-theos"
          export THEOS="$HOME/roothide-theos"
          export GITHUB_TOKEN="${{ github.token }}"
          "$THEOS/bin/install-sdk" latest
      - name: Build load path dry run package
        run: |
          set -o pipefail
          export THEOS="$HOME/roothide-theos"
          make clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 DEBUG=0 STRIP=1 \
            NNP_SAFE_BOOT_TEST=0 NNP_DEBUG_SHOW_WHILE_UNLOCKED=0 NNP_ALLOW_ALL_MEDIA=0 \
            NNP_ENABLE_DISPLAY_ASSERTION_EXPERIMENT=0 NNP_PHASE2D2_DIAGNOSTIC=1 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: notchnowplaying-load-path-package
          path: build-packages/*.deb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notchnowplaying-load-path-diagnostics
          path: build.log
          if-no-files-found: ignore
