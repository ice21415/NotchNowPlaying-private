name: Build Phase 2J safe read-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install RootHide build tools
        run: |
          set -euo pipefail
          brew install ldid dpkg
          git clone --recursive https://github.com/roothide/theos.git "$HOME/roothide-theos"
          export THEOS="$HOME/roothide-theos"
          export GITHUB_TOKEN="${{ github.token }}"
          "$THEOS/bin/install-sdk" latest
      - name: Build symbol/start-only probe
        run: |
          set -o pipefail
          export THEOS="$HOME/roothide-theos"
          make clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 DEBUG=0 STRIP=1 \
            NNP_SAFE_BOOT_TEST=1 NNP_PHASE2J_READONLY_RUNTIME=1 NNP_PHASE2J_CALL_GETTERS=0 \
            2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notchnowplaying-phase2j-safe-diagnostics
          path: build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: notchnowplaying-phase2j-safe-package
          path: build-packages/*.deb
